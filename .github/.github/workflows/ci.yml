name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check . --exit-zero

    - name: Run Pytest
      env:
        # Mocking external API credentials
        GEMINI_API_KEY: "mock_key"
        HF_TOKEN: "mock_token"
        OPENAI_API_KEY: "mock_key"
        # Real local postgres credentials for CI DB
        PGHOST: "localhost"
        PGPORT: "5432"
        PGDATABASE: "test_db"
        PGSUPERUSER: "test_user"
        PGSUPERPASSWORD: "test_password"
        APP_DB_USER: "test_user"
        APP_DB_PASSWORD: "test_password"
        PGSSLMODE: "disable"
      run: |
        pytest tests/
