name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with Ruff
      run: |
        ruff check . --exit-zero

    - name: Run Pytest
      env:
        # Mocking environment variables for tests if needed
        GEMINI_API_KEY: "mock_key"
        HF_TOKEN: "mock_token"
        OPENAI_API_KEY: "mock_key"
      run: |
        pytest tests/
